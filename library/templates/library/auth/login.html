<h2>Login</h2>

<form method="POST">
    {% csrf_token %}
    Username: <input type="text" name="username"><br><br>
    Password: <input type="password" name="password"><br><br>
    
    <button type="submit">Login</button>
</form>

{% if messages %}
  {% for msg in messages %}
    <p style="color:red;">{{ msg }}</p>
  {% endfor %}
{% endif %}
